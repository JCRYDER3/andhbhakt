services:
  postgres:
    image: postgres:16.10
    container_name: govlens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: govlens
    ports:
      - "5432:5432"
    volumes:
      - govlens_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d govlens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  govlens_pg_data: